<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div>img{
            height: 100px;
            width: 100px;
            animation-name: bounce;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;

        }
        @keyframes bounce {
            0%{
                margin-top: 500px;
                margin-left: 700px;
            }
            50%{
                margin-top: 300px;
                margin-left: 700px;
            }
            100%{
                margin-top: 500px;
                margin-left: 700px;
            }
        }
    </style>
</head>
<body>
    <div><img src="https://cdn.pixabay.com/photo/2013/07/13/10/51/football-157930_1280.png" alt=""></div>
</body>
</html>
